<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - KaZe Mods Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">

    <!-- Overlay de connexion -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <h2><i class="fa-solid fa-lock"></i> Espace Admin</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required placeholder="admin@kaze.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Mot de passe</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <div id="authError" class="auth-error hidden"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Administrateur -->
    <div id="adminDashboard" class="admin-dashboard hidden">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-cube logo-icon"></i> KaZe Admin
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="index.html" target="_blank"><i class="fa-solid fa-globe"></i> Voir le site</a>
                <button id="logoutBtn" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</button>
            </nav>
        </aside>

        <main class="admin-content">
            <header class="admin-header">
                <div class="stat-card">
                    <i class="fa-solid fa-cubes"></i>
                    <div>
                        <h3 id="statTotalMods">0</h3>
                        <p>Total Mods</p>
                    </div>
                </div>
            </header>

            <section class="admin-section">
                <h2 id="formTitle">Ajouter un nouveau mod</h2>
                <form id="modForm" class="mod-form">
                    <input type="hidden" id="modId">

                    <div class="form-group">
                        <label for="modName">Nom du Mod *</label>
                        <input type="text" id="modName" required>
                    </div>

                    <div class="form-group">
                        <label for="modCategory">Catégorie *</label>
                        <select id="modCategory" required>
                            <option value="Performance">Performance</option>
                            <option value="Optimisation">Optimisation</option>
                            <option value="Graphismes">Graphismes</option>
                            <option value="Gameplay">Gameplay</option>
                            <option value="Utilitaires">Utilitaires</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="modMcVersion">Version Minecraft *</label>
                        <input type="text" id="modMcVersion" placeholder="ex: 1.20.4" required>
                    </div>

                    <div class="form-group">
                        <label for="modLoader">Mod Loader *</label>
                        <input type="text" id="modLoader" placeholder="ex: Fabric / Forge / NeoForge" required>
                    </div>

                    <div class="form-group">
                        <label for="modAuthor">Auteur *</label>
                        <input type="text" id="modAuthor" required>
                    </div>

                    <div class="form-group">
                        <label for="modTags">Tags (séparés par des virgules)</label>
                        <input type="text" id="modTags" placeholder="fps, optifine, client">
                    </div>

                    <div class="form-group">
                        <label for="modPublishAt">📅 Date et Heure de publication (optionnel)</label>
                        <input type="datetime-local" id="modPublishAt">
                        <small style="color: #888;">Laissez vide pour publier immédiatement.</small>
                    </div>

                    <div class="form-group">
                        <label for="modModrinthUrl">Lien Modrinth (optionnel)</label>
                        <input type="url" id="modModrinthUrl" placeholder="https://modrinth.com/mod/...">
                    </div>

                    <div class="form-group">
                        <label for="modCurseforgeUrl">Lien CurseForge (optionnel)</label>
                        <input type="url" id="modCurseforgeUrl" placeholder="https://www.curseforge.com/minecraft/mc-mods/...">
                    </div>

                    <div class="form-group">
                        <label for="modImageUrl">URL de l'image *</label>
                        <input type="url" id="modImageUrl" placeholder="https://example.com/image.png" required>
                    </div>

                    <div class="form-group">
                        <label for="modDescription">Description *</label>
                        <textarea id="modDescription" rows="4" required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Enregistrer le Mod</button>
                        <button type="button" id="cancelEditBtn" class="btn btn-secondary hidden">Annuler</button>
                    </div>
                </form>
            </section>

            <section class="admin-section">
                <h2>Liste des Mods</h2>
                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Nom</th>
                                <th>Catégorie</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminModsTableBody">
                            <!-- Rempli en JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="admin.js"></script>
</body>
                        </html>
