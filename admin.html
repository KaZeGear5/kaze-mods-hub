<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - KaZe Mods Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #0f0f11; 
            color: #e0e0e0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 1rem; 
        }
        .hidden { display: none !important; }

        /* Auth Screen */
        .auth-overlay { 
            position: fixed; 
            inset: 0; 
            background: #0f0f11; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 999; 
        }
        .auth-card { 
            background: #18181b; 
            border: 1px solid #27272a; 
            padding: 2rem; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 360px; 
            text-align: center; 
        }
        .auth-card input { 
            width: 100%; 
            padding: 0.8rem; 
            margin: 0.5rem 0 1rem 0; 
            background: #0f0f11; 
            border: 1px solid #27272a; 
            border-radius: 6px; 
            color: #fff; 
        }

        /* Dashboard */
        .admin-dashboard { 
            max-width: 800px; 
            margin: 0 auto; 
        }
        .admin-header-nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #18181b; 
            padding: 1rem; 
            border-radius: 8px; 
            margin-bottom: 1.5rem; 
            border: 1px solid #27272a; 
        }
        .admin-section { 
            background: #18181b; 
            border: 1px solid #27272a; 
            border-radius: 10px; 
            padding: 1.5rem; 
            margin-bottom: 1.5rem; 
        }
        
        /* Formulaires */
        .form-group { 
            margin-bottom: 1rem; 
            display: flex; 
            flex-direction: column; 
            text-align: left; 
        }
        .form-group label { 
            font-size: 0.85rem; 
            margin-bottom: 0.4rem; 
            color: #a1a1aa; 
            font-weight: 600; 
        }
        .form-group input, .form-group select, .form-group textarea { 
            padding: 0.75rem; 
            background: #0f0f11; 
            border: 1px solid #27272a; 
            color: #fff; 
            border-radius: 6px; 
            font-size: 0.95rem; 
            width: 100%;
        }
        .form-group small {
            color: #71717a;
            margin-top: 0.3rem;
            font-size: 0.75rem;
        }

        /* Boutons */
        .btn { 
            padding: 0.75rem 1.2rem; 
            border-radius: 6px; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 0.5rem; 
        }
        .btn-primary { background: #e11d48; color: white; }
        .btn-secondary { background: #27272a; color: white; }
        
        /* Tableau */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; text-align: left; }
        th, td { padding: 0.75rem; border-bottom: 1px solid #27272a; }
        th { color: #a1a1aa; font-size: 0.85rem; }
        .thumb-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- Overlay Connexion -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <h2 style="color: #e11d48; margin-top:0;"><i class="fa-solid fa-lock"></i> Connexion Admin</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" required placeholder="Email admin">
                <input type="password" id="loginPassword" required placeholder="Mot de passe">
                <div id="authError" style="color: #ef4444; margin-bottom: 1rem; font-size: 0.85rem;" class="hidden"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="adminDashboard" class="admin-dashboard hidden">
        <div class="admin-header-nav">
            <span style="font-weight: bold; color: #e11d48;"><i class="fa-solid fa-cube"></i> KaZe Admin</span>
            <div>
                <a href="index.html" target="_blank" class="btn btn-secondary" style="font-size: 0.8rem;"><i class="fa-solid fa-globe"></i> Voir le site</a>
                <button id="logoutBtn" class="btn btn-secondary" style="font-size: 0.8rem; background: #3f3f46;"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>

        <section class="admin-section">
            <h2 id="formTitle" style="margin-top:0;">Ajouter un mod</h2>
            <form id="modForm">
                <input type="hidden" id="modId">

                <div class="form-group">
                    <label>Nom du Mod *</label>
                    <input type="text" id="modName" required>
                </div>

                <div class="form-group">
                    <label>Catégorie *</label>
                    <select id="modCategory" required>
                        <option value="Adventure">Adventure</option>
                        <option value="Cursed">Cursed</option>
                        <option value="Decoration">Decoration</option>
                        <option value="Economy">Economy</option>
                        <option value="Equipment">Equipment</option>
                        <option value="Food">Food</option>
                        <option value="Game Mechanics">Game Mechanics</option>
                        <option value="Library">Library</option>
                        <option value="Magic">Magic</option>
                        <option value="Management">Management</option>
                        <option value="Minigame">Minigame</option>
                        <option value="Mobs">Mobs</option>
                        <option value="Optimization">Optimization</option>
                        <option value="Social">Social</option>
                        <option value="Storage">Storage</option>
                        <option value="Technology">Technology</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Utility">Utility</option>
                        <option value="World Generation">World Generation</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Version Minecraft *</label>
                    <input type="text" id="modMcVersion" placeholder="ex: 1.20.4" required>
                </div>

                <div class="form-group">
                    <label>Mod Loader *</label>
                    <input type="text" id="modLoader" placeholder="ex: Fabric / Forge" required>
                </div>

                <div class="form-group">
                    <label>Auteur *</label>
                    <input type="text" id="modAuthor" required>
                </div>

                <div class="form-group">
                    <label>📅 Date/Heure de publication (optionnel)</label>
                    <input type="datetime-local" id="modPublishAt">
                    <small>Laissez vide pour publier directement.</small>
                </div>

                <div class="form-group">
                    <label>Lien Modrinth (optionnel)</label>
                    <input type="url" id="modModrinthUrl" placeholder="https://modrinth.com/mod/...">
                </div>

                <div class="form-group">
                    <label>Lien CurseForge (optionnel)</label>
                    <input type="url" id="modCurseforgeUrl" placeholder="https://www.curseforge.com/...">
                </div>

                <div class="form-group">
                    <label>URL d'image *</label>
                    <input type="url" id="modImageUrl" placeholder="https://..." required>
                </div>

                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="modDescription" rows="3" required></textarea>
                </div>

                <div style="display:flex; gap:0.5rem; margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary">Enregistrer le Mod</button>
                    <button type="button" id="cancelEditBtn" class="btn btn-secondary hidden">Annuler</button>
                </div>
            </form>
        </section>

        <section class="admin-section">
            <h2 style="margin-top:0;">Mods enregistrés (<span id="statTotalMods">0</span>)</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Nom</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminModsTableBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
