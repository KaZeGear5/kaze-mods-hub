<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - KaZe Mods & Resource Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Overlay Connexion Admin -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <h2><i class="fa-solid fa-lock"></i> Connexion Admin</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Mot de passe Admin</label>
                    <input type="password" id="loginPassword" placeholder="Saisir le mot de passe" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">Se connecter</button>
                <p id="authError" class="error-msg hidden">Mot de passe incorrect.</p>
            </form>
        </div>
    </div>

    <!-- Dashboard Admin -->
    <div id="adminDashboard" class="admin-dashboard hidden">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>KaZe Admin</h3>
            </div>
            <ul class="sidebar-menu">
                <li class="active"><a href="#"><i class="fa-solid fa-chart-line"></i> Vue d'ensemble</a></li>
                <li><a href="index.html" target="_blank"><i class="fa-solid fa-eye"></i> Voir le site</a></li>
                <li><button id="logoutBtn" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</button></li>
            </ul>
        </aside>

        <main class="admin-content">
            <header class="content-header">
                <h1>Tableau de bord</h1>
            </header>

            <!-- STATISTIQUES GLOBALES -->
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fa-solid fa-layer-group"></i>
                    <div>
                        <h3 id="statGlobal">0</h3>
                        <p>Statistique Globale (Total)</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-puzzle-piece"></i>
                    <div>
                        <h3 id="statTotalMods">0</h3>
                        <p>Total Mods</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-palette"></i>
                    <div>
                        <h3 id="statTotalPacks">0</h3>
                        <p>Total Resource Packs</p>
                    </div>
                </div>
            </div>

            <!-- FORMULAIRE DE CRÉATION ET ÉDITION -->
            <section class="admin-section" id="formSection">
                <h2 id="formTitle"><i class="fa-solid fa-plus-circle"></i> Ajouter un Contenu</h2>
                <form id="contentForm" class="mod-form">
                    <input type="hidden" id="itemId">
                    
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Type de contenu *</label>
                            <select id="itemType" required>
                                <option value="mod">🧩 Mod Minecraft</option>
                                <option value="resourcepack">🎨 Resource Pack (Texture)</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Nom *</label>
                            <input type="text" id="itemName" placeholder="ex: Sodium ou Faithful 32x" required>
                        </div>

                        <div class="input-group">
                            <label>Catégorie *</label>
                            <select id="itemCategory" required>
                                <option value="Performance">Performance</option>
                                <option value="Optimisation">Optimisation</option>
                                <option value="Shaders">Shaders</option>
                                <option value="Textures HD">Textures HD</option>
                                <option value="PvP / UI">PvP / UI</option>
                                <option value="Utilitaires">Utilitaires</option>
                                <option value="Décoration">Décoration</option>
                                <option value="Autres">Autres</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Version Minecraft *</label>
                            <input type="text" id="itemVersion" placeholder="ex: 1.20.4 / 1.16.5" required>
                        </div>

                        <div class="input-group">
                            <label>Loader / Résolution</label>
                            <input type="text" id="itemSubtype" placeholder="ex: Fabric / Forge ou 32x / 64x">
                        </div>

                        <div class="input-group">
                            <label>Lien de Téléchargement *</label>
                            <input type="url" id="itemDownloadUrl" placeholder="https://..." required>
                        </div>

                        <div class="input-group full-width">
                            <label>URL de l'image / Banner *</label>
                            <input type="url" id="itemImageUrl" placeholder="https://..." required>
                        </div>

                        <div class="input-group full-width">
                            <label>Description *</label>
                            <textarea id="itemDescription" rows="3" placeholder="Description..." required></textarea>
                        </div>
                    </div>

                    <div class="form-actions" style="margin-top: 1rem; display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-primary" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> Enregistrer</button>
                        <button type="button" class="btn btn-secondary hidden" id="cancelBtn"><i class="fa-solid fa-xmark"></i> Annuler</button>
                    </div>
                </form>
            </section>

            <!-- TABLEAU DES CONTENUS -->
            <section class="admin-section">
                <h2><i class="fa-solid fa-list"></i> Liste des Contenus (Modifier / Supprimer)</h2>
                <div class="table-wrapper" style="overflow-x: auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Image</th>
                                <th>Nom</th>
                                <th>Catégorie</th>
                                <th>Version</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody">
                            <!-- Rempli dynamiquement -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
